version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: student-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
